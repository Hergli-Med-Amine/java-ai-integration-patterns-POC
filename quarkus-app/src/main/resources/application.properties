quarkus.application.name=wealth-assistant
quarkus.http.host=127.0.0.1
quarkus.http.port=8081
quarkus.http.test-port=0
wealth.data-dir=../data
quarkus.langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.model-id=${OLLAMA_CHAT_MODEL:qwen2.5:1.5b}
quarkus.langchain4j.ollama.embedding-model.model-id=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
quarkus.mcp.server.server-info.name=wealth-assistant
quarkus.swagger-ui.always-include=true
quarkus.mcp.server.support-langchain4j-annotations=false
quarkus.devservices.enabled=false
