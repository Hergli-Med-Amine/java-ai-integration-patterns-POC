spring.application.name=wealth-assistant
server.address=127.0.0.1
wealth.data-dir=../data
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_CHAT_MODEL:qwen2.5:1.5b}
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
spring.ai.mcp.server.name=wealth-assistant
spring.ai.mcp.server.protocol=stateless
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
